server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — mọi route không match file → trả index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache mạnh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
