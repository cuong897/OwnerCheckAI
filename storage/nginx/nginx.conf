# Docker embedded DNS (127.0.0.11) — short TTL để re-resolve khi container
# backend/frontend đổi IP sau `compose up -d --force-recreate`. KHÔNG dùng
# `upstream {}` block vì nó chỉ resolve 1 lần khi nginx start → 502 sau khi
# IP đổi. Workaround: gán hostname vào biến rồi `proxy_pass http://$var` →
# nginx dùng resolver runtime, re-resolve mỗi `valid=` giây.
resolver 127.0.0.11 valid=10s ipv6=off;

client_max_body_size 500M;

server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Backend API routes ───────────────────────────────────────────────
    # Tất cả path bắt đầu bằng tên router của backend → proxy sang backend.
    location ~ ^/(auth|users|cameras|vehicles|watchlists|recognition|stats|health|docs|openapi.json|redoc)(/|$) {
        set $backend_upstream "backend:8000";
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── SSE: long-lived, no buffering ────────────────────────────────────
    location /events/ {
        set $backend_upstream "backend:8000";
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── MJPEG live preview ───────────────────────────────────────────────
    location /streams/ {
        set $backend_upstream "backend:8000";
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_request_buffering off;
    }

    # ── WebSocket (cho tương lai) ────────────────────────────────────────
    location /ws/ {
        set $backend_upstream "backend:8000";
        proxy_pass         http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # ── Frontend SPA (catch-all cuối) ────────────────────────────────────
    # React Router xử lý client-side routing — mọi path không match ở trên
    # đều fallback về index.html của frontend.
    location / {
        set $frontend_upstream "frontend:80";
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
